<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zacord — conversas</title>
<link rel="stylesheet" href="chat.css?v=group-calls-1">
<style>
:root{--bg:#111318;--panel:#191c23;--panel2:#222630;--line:#2c303a;--text:#f4f5f8;--muted:#9299a8;--accent:#766af2;--green:#32c994}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.app{height:100vh;min-height:500px;display:grid;grid-template-columns:68px 290px minmax(0,1fr);overflow:hidden}.rail{background:#14161b;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:17px 0;gap:12px}.brand,.avatar{display:grid;place-items:center;flex:none;border-radius:50%;font-weight:750}.brand{border-radius:15px;width:43px;height:43px;background:linear-gradient(145deg,#958aff,#5d51d9);font-size:21px;margin-bottom:9px}.rail button{width:43px;height:43px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}.rail button:hover,.rail button.active{background:#2b2843;color:#c1baff}.spacer{flex:1}.avatar{width:39px;height:39px;background:#3d4764;color:white}.sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.side-head{padding:22px 17px 16px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;color:#a8a0ff;text-transform:uppercase;letter-spacing:1.5px;font-weight:800}.title{font-size:21px;font-weight:750;margin:4px 0 15px}.search{position:relative}.search span{position:absolute;left:11px;top:8px;color:var(--muted)}input{font:inherit;color:var(--text);background:#12151a;border:1px solid #303541;border-radius:9px;padding:10px 12px;outline:none;width:100%}input:focus{border-color:var(--accent)}.search input{padding-left:33px}.section{display:flex;align-items:center;justify-content:space-between;padding:17px 16px 7px;font-size:10px;color:var(--muted);font-weight:800;letter-spacing:1px;text-transform:uppercase}.icon{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:7px}.icon:hover{background:#30343e;color:white}.list{padding:3px 8px;overflow:auto;flex:1}.chat{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:0;padding:10px 8px;border-radius:10px;color:inherit;cursor:pointer;margin:2px 0}.chat:hover{background:#242832}.chat.selected{background:#2c2a40}.copy{min-width:0;flex:1}.chatline{display:flex;justify-content:space-between;gap:5px}.name{font-weight:680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:var(--muted)}.preview{margin-top:3px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile{display:flex;align-items:center;gap:9px;border-top:1px solid var(--line);padding:12px}.profile .copy{font-size:12px}.profile-name{font-weight:700;font-size:13px}.online{color:var(--green);font-size:11px}.main{display:flex;flex-direction:column;min-width:0;background:#171a20}.topbar{height:70px;display:flex;align-items:center;gap:11px;padding:0 23px;border-bottom:1px solid var(--line);background:var(--panel)}.topcopy{flex:1;min-width:0}.topname{font-weight:720}.status{font-size:11px;color:var(--green);margin-top:2px}.actions{display:flex;gap:6px}.actions button{height:37px;width:37px;border:0;border-radius:9px;background:transparent;color:#aeb3c0;font-size:18px;cursor:pointer}.actions button:hover{background:#30343e;color:white}.messages{flex:1;overflow:auto;padding:24px max(18px,calc((100% - 850px)/2));display:flex;flex-direction:column;gap:16px}.day{text-align:center;color:#818898;font-size:10px;margin-bottom:5px}.message{display:flex;align-items:flex-start;gap:9px;max-width:80%}.message.mine{align-self:flex-end;flex-direction:row-reverse}.bubblebox{min-width:0}.meta{display:flex;gap:8px;margin:0 0 4px 2px;font-size:11px}.meta strong{font-size:12px}.meta span{color:var(--muted);font-size:10px}.bubble{background:#252933;border:1px solid #303541;padding:10px 13px;border-radius:4px 13px 13px 13px;overflow-wrap:anywhere;white-space:pre-wrap}.mine .bubble{background:#5148a8;border-color:#6258bd;border-radius:13px 4px 13px 13px}.composer-area{padding:10px 22px 18px}.composer{max-width:900px;margin:auto;display:flex;align-items:center;gap:7px;padding:7px;background:#222630;border:1px solid #303541;border-radius:13px}.composer input{border:0;background:transparent;flex:1;min-width:0}.composer input:focus{border:0}.composer button{width:35px;height:35px;border:0;border-radius:8px;background:transparent;color:#b1b6c3;font-size:18px;cursor:pointer}.composer button:hover{background:#303541}.composer .send{background:var(--accent);color:white}.empty{height:100%;display:grid;place-items:center;text-align:center;padding:25px}.emptybox{max-width:380px}.empty-icon{margin:0 auto 15px;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:#2c2943;color:#bbb3ff;font-size:28px}.empty h2{margin:0 0 7px;font-size:21px}.empty p{color:var(--muted);margin:0 0 17px}.primary{border:0;background:var(--accent);color:#fff;padding:10px 15px;border-radius:9px;font-weight:700;cursor:pointer}.primary:hover{background:#887df7}.back{display:none!important}.modalback{position:fixed;inset:0;background:#090a0dcc;display:grid;place-items:center;padding:17px;z-index:5}.modal{width:min(410px,100%);background:#1d2028;border:1px solid #343946;border-radius:16px;padding:23px;box-shadow:0 24px 80px #0009}.modal h2{font-size:21px;margin:0 0 5px}.modal p{font-size:13px;color:var(--muted);margin:0 0 17px}.modal label{display:block;color:#c4c8d1;font-size:12px;margin:12px 0 6px}.modal input{margin-top:6px}.modal .hint{color:var(--muted);font-size:11px;margin-top:6px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.secondary{border:0;border-radius:9px;padding:9px 13px;background:#30343e;color:white;cursor:pointer}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2d333e;border:1px solid #48505e;padding:10px 15px;border-radius:10px;z-index:9}.call{position:fixed;top:82px;right:20px;z-index:3;background:#252a34;border:1px solid #3b4250;border-radius:12px;padding:12px 15px;box-shadow:0 10px 30px #0008}.call small{display:block;color:var(--muted)}.call button{margin-left:10px;background:#d84d5a;color:white;border:0;border-radius:7px;padding:7px;cursor:pointer}
@media(max-width:720px){.app{grid-template-columns:56px 245px minmax(0,1fr)}.messages{padding:18px 13px}.topbar{padding:0 13px}.composer-area{padding:9px 11px 13px}}
@media(max-width:540px){.app{grid-template-columns:52px minmax(0,1fr)}.sidebar{grid-column:2;grid-row:1}.main{display:none;grid-column:2;grid-row:1}.app.chat-open .sidebar{display:none}.app.chat-open .main{display:flex}.rail{grid-column:1;grid-row:1}.side-head{padding:17px 12px 11px}.title{font-size:19px}.back{display:block!important}.message{max-width:94%}.topbar{height:62px}.actions button{width:32px}}
</style></head>
<body><div class="app" id="app"><nav class="rail"><div class="brand">Z</div><button class="active" title="Conversas">▣</button><button id="groups" title="Criar grupo">♧</button><button id="add" title="Adicionar contato">＋</button><div class="spacer"></div><button id="settings" title="Perfil">⚙</button><div class="avatar" id="myAvatar">?</div></nav><aside class="sidebar"><header class="side-head"><div class="eyebrow">Zacord</div><div class="title">Mensagens</div><div class="search"><span>⌕</span><input id="search" placeholder="Buscar conversas..." aria-label="Buscar conversas"></div></header><div class="section">Conversas recentes <button class="icon" id="add2" title="Adicionar contato">＋</button></div><div class="list" id="list"></div><footer class="profile"><div class="avatar" id="profileAvatar">?</div><div class="copy"><div class="profile-name" id="profileName">Visitante</div><div class="online">● disponível</div></div></footer></aside><main class="main" id="main"></main></div><div id="overlay"></div><div id="toasts" aria-live="polite"></div>
